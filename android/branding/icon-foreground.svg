<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
  <!-- Adaptive icon FOREGROUND.
       Canvas is 108x108 dp, rendered here at 432px = 4x for highest density.
       Important: Android masks/transforms this layer; everything visually
       essential MUST sit within the central 66/108 area = inner 264x264 of 432.
       Center origin is (216, 216). Safe zone runs from (84,84) to (348,348).
       All shapes below stay inside (84..348) on both axes. -->
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2.5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Candlestick chart (scaled to safe zone) -->
  <g>
    <rect x="100" y="248" width="32" height="50" rx="5" fill="#FFFFFF" opacity="0.55"/>
    <line x1="116" y1="232" x2="116" y2="316" stroke="#FFFFFF" stroke-width="3.5" opacity="0.55"/>

    <rect x="162" y="210" width="32" height="68" rx="5" fill="#FFFFFF" opacity="0.7"/>
    <line x1="178" y1="194" x2="178" y2="294" stroke="#FFFFFF" stroke-width="3.5" opacity="0.7"/>

    <rect x="224" y="168" width="32" height="90" rx="5" fill="#FFFFFF" opacity="0.85"/>
    <line x1="240" y1="148" x2="240" y2="274" stroke="#FFFFFF" stroke-width="3.5" opacity="0.85"/>

    <rect x="286" y="124" width="32" height="118" rx="5" fill="#FFFFFF"/>
    <line x1="302" y1="104" x2="302" y2="258" stroke="#FFFFFF" stroke-width="3.5"/>
  </g>

  <!-- Trend line -->
  <g filter="url(#ds)" fill="none" stroke="#FFFFFF" stroke-width="12"
     stroke-linecap="round" stroke-linejoin="round">
    <polyline points="100,272 162,242 224,212 286,168 348,118"/>
  </g>

  <!-- Arrowhead -->
  <g fill="#FFFFFF" filter="url(#ds)">
    <polygon points="348,118 324,108 330,134"/>
  </g>

  <!-- Data point dots -->
  <g fill="#FFFFFF">
    <circle cx="100" cy="272" r="7.5"/>
    <circle cx="162" cy="242" r="7.5"/>
    <circle cx="224" cy="212" r="7.5"/>
    <circle cx="286" cy="168" r="7.5"/>
  </g>
</svg>
