name: Android release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Write local.properties
        working-directory: android
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          PRO_PRODUCT_ID=${{ secrets.PRO_PRODUCT_ID || 'pro_monthly' }}
          EOF

      - name: Build release bundle
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload mapping
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
